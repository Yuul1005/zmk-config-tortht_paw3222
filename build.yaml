# DYA Studio 対応ビルド
# - tortht_R: PC とつながる側 (central)。Studio RPC を有効化
# - tortht_L: peripheral
# - settings_reset: 設定リセット用
---
include:
  - board: xiao_ble//zmk
    shield: tortht_R
    snippet: studio-rpc-usb-uart
  - board: xiao_ble//zmk
    shield: tortht_L
  - board: xiao_ble//zmk
    shield: settings_reset
